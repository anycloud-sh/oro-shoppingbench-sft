name: Promote validated image
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Validated sha256 digest
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      DIGEST: ${{ inputs.digest }}
      PACKAGE: ghcr.io/anycloud-sh/oro-shoppingbench-sft
      RELEASE: 0.1.0-2fbf90f-r1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recheck committed GPU evidence
        run: |
          pip install jsonschema==4.24.0
          python validation/verify.py validation/lambda-a10 "$PACKAGE@$DIGEST"
          jq -e --arg image "$PACKAGE@$DIGEST" \
            '.image == $image and .anonymous_pull == true and .repository_linked == true' \
            validation/registry.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote identical manifest without rebuilding
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false --tag "$PACKAGE:$RELEASE" "$PACKAGE@$DIGEST"
          actual="$(docker buildx imagetools inspect "$PACKAGE:$RELEASE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$actual" = "$DIGEST"
