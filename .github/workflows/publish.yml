name: Build candidate
on:
  push:
    branches: [main]
    paths:
      [
        Dockerfile,
        requirements.txt,
        infer.py,
        examples/**,
        .github/workflows/publish.yml,
      ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test inputs and real reference outputs
        run: |
          pip install jsonschema==4.24.0
          python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: IMAGE_REVISION=${{ github.sha }}
          tags: ghcr.io/anycloud-sh/oro-shoppingbench-sft:candidate-${{ github.sha }}
      - name: Record immutable validation input
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p candidate
          jq -n --arg digest "$DIGEST" --arg source "$GITHUB_SHA" \
            '{digest:$digest,artifact_revision:$source}' > candidate/image.json
          echo "Validate ghcr.io/anycloud-sh/oro-shoppingbench-sft@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oro-candidate
          path: candidate/image.json
          retention-days: 30
